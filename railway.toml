[build]
builder = "nixpacks"
buildCommand = "cd server && npm install"

[deploy]
startCommand = "cd server && npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 30

[[services]]
name = "server"

[services.envs]
RESEND_API_KEY = { required = true }
DATABASE_PATH = { required = false, default = "/data/data.db" }
