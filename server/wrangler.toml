name = "szmatex-server"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[[d1_databases]]
migrations_dir = "drizzle"
binding = "DB"
database_name = "szmatex"
database_id = "dfc76e44-e6f3-45fb-84cd-dcaeb6190bda"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = false

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
